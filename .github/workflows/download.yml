name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Indir
      run: |
        pip install yt-dlp
        yt-dlp -x --audio-format mp3 "https://www.youtube.com/watch?v=69L-nKRY3ac"
    - name: Yukle
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp3
