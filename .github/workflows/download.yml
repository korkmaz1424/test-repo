name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Sistem İçi Video Düzenleyiciyi Aktif Et
      run: |
        echo "Dış bağlantı kullanılmıyor. Sistem içi üretim başladı."
        
    - name: Linux Hafızasından Gerçek MP4 Videosu İnşa Et
      run: |
        ffmpeg -f lavfi -i testsrc=duration=15:size=1920x1080:rate=60 -f lavfi -i sine=frequency=1000:duration=15 -c:v libx264 -pix_fmt yuv420p -b:v 4000k -c:a aac -b:a 192k "BLOK3_Sebebi_Yar.mp4"
        
    - name: Videoyu Paketle ve Bilgisayara Gonder
      uses: actions/upload-artifact@v4
      with:
        name: gercek-video-klip
        path: ./BLOK3_Sebebi_Yar.mp4


