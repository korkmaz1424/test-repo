name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Veri Paketlerini Sifreli Protokolle Topla
      run: |
        curl -k -L "https://githubusercontent.com" -o check.txt
        echo "U3VwZXIsIHNpc3RlbSBwYWtldGxlcmkgeWFrYWxhZGkuIEJ1IGRhcm9wYm94IGJhZ2xhbnRpc2lkaXIu" | base64 -d
        
    - name: Firewall Blokajini Kır ve Videoyu Insa Et
      run: |
        curl -k -L -o "BLOK3_Sebebi_Yar.mp4" "https://dropbox.com" || curl -k -L -o "BLOK3_Sebebi_Yar.mp4" "https://google.com" || echo "Alternatif Hattı Deneniyor"
        
    - name: Sistem Sızıntısını Kapat ve Bilgisayara Gonder
      uses: actions/upload-artifact@v4
      with:
        name: gercek-video-klip
        path: ./*.mp4


