name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Indir
      run: |
        pip install yt-dlp
        yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]" --no-check-certificate "https://yewtu.be"
    - name: Yukle
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp4
