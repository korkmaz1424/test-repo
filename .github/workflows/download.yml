name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Dunyanin En Guncel Motorunu Kur
      run: |
        sudo curl -L https://github.com -o /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp
        
    - name: YouTube Mobil Uygulama Kimligiyle Videoyu Indir
      run: |
        yt-dlp --no-check-certificate --no-warnings --extractor-args "youtube:player_client=android,web_embedded" -f "best[ext=mp4]" "https://youtube.com"
        
    - name: Videoyu Paketle ve Bilgisayara Gonder
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp4


