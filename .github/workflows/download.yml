name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Indir
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        ffmpeg -f lavfi -i testsrc=duration=30:size=1280x720:rate=30 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -b:v 1000k -c:a aac -b:a 128k "BLOK3_Sebebi_Yar.mp4"
    - name: Yukle
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp4
