name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Tarayici Altyapisini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        pip install playwright
        playwright install chromium
    - name: Videoyu Yakala ve Indir
      run: |
        python3 -c "
        import urllib.request, json
        # YouTube bot engelini asan api uzerinden videonun direkt mp4 linkini cozuyoruz
        req = urllib.request.Request('https://wuk.sh', 
            data=json.dumps({'url': 'https://youtube.com', 'vQuality': '720'}).encode('utf-8'),
            headers={'Content-Type': 'application/json', 'Accept': 'application/json'})
        res = json.loads(urllib.request.urlopen(req).read().decode('utf-8'))
        if 'url' in res:
            urllib.request.urlretrieve(res['url'], 'BLOK3_Sebebi_Yar.mp4')
        "
    - name: Yukle
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp4

