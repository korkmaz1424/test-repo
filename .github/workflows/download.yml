name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Videoyu Engelsiz Sunucudan Cek
      run: |
        curl -k -L -o "BLOK3_Sebebi_Yar.mp4" "https://catbox.moe"
    - name: Videoyu Paketle ve Bilgisayara Gonder
      uses: actions/upload-artifact@v4
      with:
        name: video-klip
        path: ./*.mp4

