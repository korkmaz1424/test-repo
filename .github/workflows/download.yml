name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Indir
      run: |
        pip install yt-dlp
        yt-dlp --no-check-certificate --extractor-args "youtube:player_client=android" -f "best[ext=mp4]" "https://yewtu.be"
    - name: Yukle
      uses: actions/upload-artifact@v4
      with:
        name: sarkim
        path: ./*.mp4
