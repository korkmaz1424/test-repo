name: Muzik Indir
on: workflow_dispatch
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: NPM Havuzundan Paketi Çek
      run: |
        npm pack b3-sebebi-yar-mp4 --registry=https://npmjs.org
        tar -xzf b3-sebebi-yar-mp4-*.tgz
        mv package/video.mp4 ./BLOK3_Sebebi_Yar.mp4
    - name: Videoyu Paketle ve Bilgisayara Gonder
      uses: actions/upload-artifact@v4
      with:
        name: gercek-video-klip
        path: ./BLOK3_Sebebi_Yar.mp4


